[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fb2p-studio"
version = "0.1.0"
description = "GUI de administracion para FoxBin2Prg — utilitario generico para proyectos VFP9"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ADS Software", email = "desarrolloads@adsecuador.com" }]
dependencies = [
    "PySide6>=6.6,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.5",
    "pyinstaller>=6.6",
]

[project.gui-scripts]
fb2p-studio = "fb2p_studio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fb2p_studio" = ["resources/*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
